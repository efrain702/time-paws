  cx.fillStyle='#000';cx.fillRect(0,0,W,H);
  cx.setTransform(S,0,0,S,ox+(Math.random()-.5)*shake*S,(Math.random()-.5)*shake*S);
  const BG=BGS[stage];

    const fl=STAGES[stage].floor,r=BG.naturalHeight/BG.naturalWidth,visW=W/S;let dw=Math.max(1300,visW+40);if(dw*r*(1-fl)<270)dw=270/((1-fl)*r);const dh=dw*r;
    cx.drawImage(BG,640-dw/2,460-STAGES[stage].floor*dh,dw,dh);
    const fg=cx.createLinearGradient(0,600,0,720);fg.addColorStop(0,'#0000');fg.addColorStop(1,'#0006');cx.fillStyle=fg;cx.fillRect(-500,600,2280,120);
  }else{
  let g=cx.createLinearGradient(0,0,0,720);g.addColorStop(0,'#2a0b5e');g.addColorStop(.6,'#7a2fb8');g.addColorStop(1,'#ff7ad9');
  cx.fillStyle=g;cx.fillRect(-500,0,2280,720);
  cx.save();cx.translate(640,250);
  for(let i=0;i<14;i++){cx.rotate(T*0.25+i*0.45);cx.strokeStyle=`hsla(${280+i*6},90%,${60+i*2}%,.18)`;cx.lineWidth=18;cx.beginPath();cx.arc(0,0,40+i*22,0,Math.PI*1.2);cx.stroke();}
  cx.restore();
  cx.fillStyle='#1b0b38';for(let i=0;i<26;i++){const bw=60+(i*37)%50,bh=120+(i*71)%160;cx.fillRect(-460+i*85,480-bh,bw,bh);}
  cx.fillStyle='#ffd23f22';for(let i=0;i<26;i++){const bh=120+(i*71)%160;for(let j=0;j<4;j++)if((i*7+j*3)%5<2)cx.fillRect(-450+i*85+j*12,490-bh+j*30,6,10);}
  g=cx.createLinearGradient(0,460,0,720);g.addColorStop(0,'#2c1f4a');g.addColorStop(1,'#120a24');cx.fillStyle=g;cx.fillRect(-500,460,2280,260);
  cx.fillStyle='#ff7ad966';cx.fillRect(-500,460,2280,3);
  cx.strokeStyle='#ff7ad944';cx.lineWidth=2;for(let i=-18;i<34;i++){cx.beginPath();cx.moveTo(640+(i-7)*26,460);cx.lineTo(640+(i-7)*120,720);cx.stroke();}
  for(let k=0;k<5;k++){const yy=460+[18,45,85,140,215][k];cx.beginPath();cx.moveTo(-500,yy);cx.lineTo(1780,yy);cx.stroke();}
  }
  if(state!=='title'){
    for(const it of items){const gyy=gy(it.z),sc=zs(it.z),bob=Math.sin(it.t*5)*4,blink=it.t>9&&Math.floor(it.t*8)%2;if(blink)continue;
      cx.save();cx.translate(it.x,gyy+it.y+bob);cx.scale(sc,sc);
      cx.fillStyle='#0006';cx.beginPath();cx.ellipse(0,-bob+2,30,7,0,0,7);cx.fill();
      const gl=cx.createRadialGradient(0,-35,5,0,-35,60);gl.addColorStop(0,'#ffd23f88');gl.addColorStop(1,'#ffd23f00');cx.fillStyle=gl;cx.fillRect(-60,-95,120,120);
      cx.lineWidth=5;cx.strokeStyle='#2a1500';cx.fillStyle='#c8762a';cx.beginPath();cx.ellipse(0,-30,28,28,0,0,7);cx.fill();cx.stroke();
      cx.fillStyle='#ffb52e';cx.beginPath();cx.ellipse(0,-56,30,9,0,0,7);cx.fill();cx.stroke();
      cx.fillStyle='#ffcf4a';cx.beginPath();cx.moveTo(-14,-52);cx.quadraticCurveTo(-18,-30,-10,-28);cx.quadraticCurveTo(-4,-34,-6,-52);cx.fill();
      cx.fillStyle='#f4e3c0';cx.fillRect(-20,-38,40,16);cx.strokeRect(-20,-38,40,16);
      cx.fillStyle='#2a1500';cx.font='bold 11px Arial Black';cx.textAlign='center';cx.fillText('HONEY',0,-26);
      cx.restore();}
    const acts=[...enemies.map(e=>({o:e,k:'e'})),...players.map(p=>({o:p,k:'p'}))];if(boss)acts.push({o:boss,k:'b'});
    for(const a of acts)shadow(a.o.x,(a.k==='b'?1.5:a.k==='e'?.85:1)*(a.k==='p'?1+a.o.y/700:1),a.o.z);
    acts.sort((a,b)=>b.o.z-a.o.z);
    for(const {o,k} of acts){
      const sc=zs(o.z),gyy=gy(o.z);
      if(k==='p'){
        if(!o.alive){drawSprite(o,CHARS[o.c].A.crouch,o.x,gyy,o.face,.45,2,sc);continue;}
        if(!(o.inv>0&&Math.floor(T*20)%2))drawSprite(o,AN(o),o.x,gyy+o.y,o.face,1,undefined,sc);
      }else{
        if(o.dead>0.4&&k==='e'&&Math.floor(T*16)%2)continue;
        drawSprite(o,AN(o),o.x,gyy,o.face,1,undefined,sc);
        if(o.flash>0){cx.save();cx.globalCompositeOperation='lighter';cx.globalAlpha=o.flash*.5;drawSprite(o,AN(o),o.x,gyy,o.face,1,undefined,sc);cx.restore();}
      }
    }
  }
  rings.forEach(r=>{const k=r.t/0.5;if(r.sl){cx.save();cx.translate(r.x,gy(r.z)-190);cx.scale(r.sl,1);cx.globalAlpha=1-k;cx.shadowColor='#9ff';cx.shadowBlur=30;const R=150+k*70;cx.fillStyle='#e8ffff';cx.beginPath();cx.arc(-40,0,R,-1.25,1.25);cx.arc(-40-R*0.45,0,R*1.05,1.1,-1.1,true);cx.closePath();cx.fill();cx.strokeStyle='#6fdcff';cx.lineWidth=6;cx.stroke();cx.restore();return;}cx.save();cx.globalAlpha=1-k;cx.strokeStyle='#ffd23f';cx.lineWidth=18*(1-k)+4;cx.beginPath();cx.ellipse(r.x,gy(r.z)-40,60+k*300,20+k*90,0,0,7);cx.stroke();cx.strokeStyle='#ff7ad9';cx.lineWidth=8;cx.beginPath();cx.ellipse(r.x,gy(r.z)-140,40+k*220,40+k*200,0,0,7);cx.stroke();cx.restore();});
  sparks.forEach(s=>{if(s.dust){cx.fillStyle=`rgba(220,200,190,${s.l*.6})`;cx.beginPath();cx.arc(s.x,s.y,14*(1.4-s.l),0,7);cx.fill();}else{cx.fillStyle=`rgba(255,${200+Math.random()*55|0},60,${s.l})`;cx.fillRect(s.x,s.y,7,7);}});
  pops.forEach(p=>{cx.save();cx.translate(p.x,p.y);const sc=(p.big?1.4:1)*(1+Math.max(0,p.t-0.8)*2);cx.scale(sc,sc);cx.rotate(p.fixed?0:-0.12);
    cx.font='bold 46px Arial Black';cx.textAlign='center';cx.lineWidth=10;cx.strokeStyle='#000';cx.strokeText(p.txt,0,0);cx.fillStyle=p.fixed?'#fff':p.big?'#ff3b3b':'#ffd23f';cx.fillText(p.txt,0,0);cx.restore();});
  cx.setTransform(S,0,0,S,ox,0);
  if(state==='title'){
    cx.fillStyle='#000a';cx.fillRect(-500,0,2280,720);
    cx.save();cx.translate(640,150);const s=1+Math.sin(T*3)*.03;cx.scale(s,s);cx.rotate(-0.04);
    cx.font='bold 130px Arial Black';cx.textAlign='center';cx.lineWidth=24;cx.strokeStyle='#000';cx.strokeText('TIME PAWS',0,0);
    const tg=cx.createLinearGradient(0,-100,0,20);tg.addColorStop(0,'#fff27a');tg.addColorStop(.5,'#ffb020');tg.addColorStop(1,'#ff4d2e');cx.fillStyle=tg;cx.fillText('TIME PAWS',0,0);cx.restore();
    bigText(STAGES.length+' STAGES · NEON CITY → PREHISTORIC JUNGLE → GHOST SHIP',640,215,22,'#ff7ad9');
    // character pick
    ORDER.forEach(c=>{const x=PX[c];
      const on=pick===c,C=CHARS[c];
      cx.save();cx.globalAlpha=on?1:.5;
      if(on){cx.fillStyle=C.color+'33';cx.beginPath();cx.ellipse(x,GROUND-150,135,210,0,0,7);cx.fill();}
      shadow(x,.8);drawSprite({t:T,anim:'idle',c},C.A.idle,x,GROUND,x<640?1:-1,1,Math.floor(T*C.A.idle.fps)%C.A.idle.f.length,.82);
      cx.restore();
      bigText(C.name,x,GROUND+48,on?40:30,on?C.color:'#aaa');
      bigText({r:'POWER',j:'REACH',f:'SMASH',b:'SPEED'}[c],x,GROUND+78,16,on?'#fff':'#888');
    });
    bigText(Math.floor(T*2)%2?'◀  PICK YOUR BEAR  ▶':'TAP '+CHARS[pick].name+' AGAIN TO START',640,255,26,Math.floor(T*2)%2?'#fff':CHARS[pick].color);
    bigText('2nd controller? Press any button in-game to join',640,705,16,'#ffd23f');
  }else{
    hudBar(players[0],40,'left');
    if(players[1])hudBar(players[1],936,'right');
    else if(Math.floor(T*1.5)%2){cx.font='bold 22px Arial Black';cx.textAlign='right';cx.lineWidth=5;cx.strokeStyle='#000';cx.strokeText('2P PRESS ANY BUTTON',1240,52);cx.fillStyle='#5ec8ff';cx.fillText('2P PRESS ANY BUTTON',1240,52);}
    bigText('SCORE '+score,640,52,28,'#fff');
    bigText('STAGE '+(stage+1)+' · '+(boss?'BOSS':'WAVE '+Math.max(1,wave)+'/'+WAVES.length),640,84,18,'#ff7ad9');
    if(combo>1)bigText(combo+' HIT COMBO!',640,boss?190:140,40,'#ff7ad9');
    if(boss){cx.font='bold 24px Arial Black';cx.textAlign='center';cx.lineWidth=5;cx.strokeStyle='#000';cx.strokeText(STAGES[stage].bossName,640,118);cx.fillStyle='#ff4d4d';cx.fillText(STAGES[stage].bossName,640,118);
      cx.fillStyle='#000';cx.fillRect(390,126,500,20);cx.fillStyle='#c33cff';cx.fillRect(392,128,496*boss.hp/boss.maxhp,16);}
  }
  if(state==='over'){cx.fillStyle='#000a';cx.fillRect(-500,0,2280,720);bigText('GAME OVER',640,300,90,'#ff3b3b');bigText('SCORE '+score+'   BEST '+hiscore,640,380,30,'#fff');if(stateT>1&&Math.floor(T*2)%2)bigText('PRESS PUNCH TO CONTINUE',640,470,28,'#ffd23f');}
  if(state==='warp'){
    const k=Math.min(1,stateT/4.2);
    if(stateT>2){cx.save();cx.translate(640,360);for(let i=0;i<18;i++){cx.rotate(T*(1+k*4)+i*.35);cx.strokeStyle=`hsla(${270+i*8},95%,65%,${(stateT-2)/2.2*.6})`;cx.lineWidth=30;cx.beginPath();cx.arc(0,0,30+i*45*(1+k),0,Math.PI*1.3);cx.stroke();}cx.restore();
      cx.fillStyle=`rgba(255,255,255,${Math.max(0,(stateT-3.6)/0.6)})`;cx.fillRect(-500,0,2280,720);}
    bigText('STAGE '+(stage+1)+' CLEAR!',640,260,80,'#ffd23f');bigText('+5000  SCORE '+score,640,330,30,'#fff');
    if(stateT>1.6)bigText('⏳ TIME WARP! ⏳',640,430,54,'#ff7ad9');
    if(stateT>2.4)bigText('NEXT: '+STAGES[stage+1].name,640,490,26,'#fff');
  }
  if(state==='clear'){cx.fillStyle='#0008';cx.fillRect(-500,0,2280,720);bigText('YOU SAVED TIME!',640,300,86,'#ffd23f');bigText('SCORE '+score+'   BEST '+hiscore,640,380,30,'#fff');if(stateT>1&&Math.floor(T*2)%2)bigText('PRESS PUNCH TO PLAY AGAIN',640,470,28,'#ff7ad9');}
  if(state==='play'){cx.textAlign='center';cx.font='bold 18px Arial';cx.fillStyle='#fffc';
    cx.fillText(padNames.length?'🎮 Stick: move · A: jump · X: attack (3× finisher) · L/R shoulder: BEAR RAGE':'HIT 3× for the finisher · RAGE hits everyone around you (costs a little health) · grab 🍯 honey to heal',640,708);}
}
for(const k in SHEETS){const im=new Image();im.onload=()=>{if(++loaded===Object.keys(SHEETS).length)requestAnimationFrame(loop);};im.src=SHEETS[k].src;IMGS[k]=im;}
